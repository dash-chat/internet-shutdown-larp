# The anonymous informant (docs/design.md). A spec bot, not a scenario pack:
# this file must stay out of scenarios/ (every character bot parses that whole
# directory as mission packs, and this schema is different). Texts are sent
# VERBATIM into the direct chat, in order.
#
# He has no QR poster, and he runs on MIRA'S CARD ALONE. The only way to meet
# him is her tip: a deep link she hands out after a player carries something
# to her (scenarios/sister.toml, informant_tip).
#
# The chat, in order, for a player who arrives knowing nothing: who he is →
# it's about THE MAYOR, the man on the poster → the MOTIVE, stated plainly:
# he made this emergency to rule the town through fear — frightened, cut-off
# people don't ask questions, they obey → the evidence, one line copied
# VERBATIM from the mayor's own order → the MISSION: walk to the town hall,
# paste the line into the mayor's own chat, watch him read it.
#
# The mayor listens for that exact line (mayor.toml); a unit test in
# crates/larp-bot/src/spec.rs fails if the two drift.
#
# Voice: typing fast with the door watched. Short. No speeches.

name = "Anonymous"

greeting = [
  """Hey. I can't tell you my name. I work in the town hall, three doors from the mayor's office. Mira trusts you, so I will.""",
  """It's about the mayor. The man who welcomed you.""",
  """The fires were no accident. He ordered them lit, and shut down the internet.""",
  """He's been manipulating this place for years, and this is the next step: keep everyone frightened and alone. A scared town doesn't ask questions — it does what it's told.""",
  """Fear is how he holds this town. We need to bring him down.""",
  """I was in his office an hour ago, there is a ton of incriminating evidence that would mean several years in prison. I couldn't take any paper, so I copied this one line, word for word:""",
  """Let the north side burn until they stop asking questions.""",
  """Walk to the town hall and paste the previous message into the mayor's own chat. Then stay and watch him read it.""",
  """Face him with his own words.""",
]
