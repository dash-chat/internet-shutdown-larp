# The anonymous informant (docs/design.md). A spec bot, not a scenario pack:
# this file must stay out of scenarios/ (every character bot parses that whole
# directory as mission packs, and this schema is different). Texts are sent
# VERBATIM into the direct chat, in order. Every station runs the informant,
# and every one tells the whole secret: the mayor's password, and what to do
# with it — paste it into the mayor's own chat, the way every other message in
# this game travels.
#
# The password here MUST stay in step with the mayor's trigger phrase
# (mayor.toml); a unit test in crates/larp-bot/src/spec.rs fails if it drifts,
# because a password nobody hands out makes the endgame unreachable.

