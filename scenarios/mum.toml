# Mama's mission pack. Texts are sent VERBATIM: the other bots recognize a
# delivery by the text a player pastes into their chat (whitespace and case
# are forgiven, nothing else), so edit them here, never live.
#
# Voice: how a mother actually texts — short, half worry, the instruction at
# the end. Every mission NAMES the chat to paste into ("copy this into X's
# chat"): that name is the whole puzzle, never drop it.

name = "Mama"

greeting = """It's Mama, love. Thank god this thing works — the phone's been dead all morning and we're packing for the shelter. You're the only one of us out on the street. Stay where I can reach you, and stay out of the smoke."""

# Sent when a player pastes in a message meant for somebody else. Just says
# no: working out where it belongs is the players' job.
misdelivered = """Love, this one isn't for me!"""

# No informant_tip: only Mira hands out the informant (scenarios/sister.toml).

[[missions]]
to = "grandpa"
text = """Grandpa's not picking up and the fire's on his side of the hill. Tell him: come down tonight, Dad, no arguing. Copy this into Grandpa Amir's chat and take it up to him."""
success = """Still standing, aren't I. All right, all right. I'll pack a bag."""

[[missions]]
to = "neighbour"
text = """They won't let Luna (the cat) into the shelter. Ask Nadia if she'll take her — copy this into Nadia's chat."""
success = """Course, bring her over. She can sleep with the rest of the zoo."""

[[missions]]
to = "sister"
text = """Your sister's at the school desk imagining the worst. Tell her we're all fine and coming tonight — copy this into Mira's chat."""
success = """Ok. Ok, I can breathe. Love you all so much."""

[[missions]]
to = "grandpa"
text = """Ask Grandpa how many heart pills he has left — I'll ask for more here. Copy this into Grandpa Amir's chat. Don't let him fob you off."""
success = """Two blisters. Ten days. It's not a drama."""

[[missions]]
to = "neighbour"
text = """I think we left the back window open. The keys are under the flowerpot. Copy this into Nadia's chat, she'll know what to do."""
success = """Window's shut, keys are here. Look after yourselves."""

[[missions]]
to = "cousin"
text = """Someone tell Rafa he's not fireproof. He'll listen to you sooner than to me. Copy this into Rafa's chat."""
success = """Ha. I'm wearing the gloves and everything, promise."""
