# Mira's mission pack. Texts are sent VERBATIM (see mum.toml). She is IN town
# on her own Pi station: the desk at the school shelter, with the list of who
# has arrived. Everyone's names pass through her.
#
# Voice: the youngest one, texting fast, half a thought per line.

name = "Mira (sister)"

greeting = """Mira here. They've put me on the desk at the school shelter, so I've got the list of who's made it in. Don't leave me guessing about you lot, please."""

misdelivered = """This one's not for me!"""

# Mira answers the first message from the players after this long without
# hearing from them — she's been staring at the door, waiting for names.
[comeback]
after_secs = 600
text = """Hey!! Anything? I'm losing my mind over here."""

[[missions]]
to = "mum"
text = """They've moved us — the evacuation point is the school now, not the sports centre. Copy this into Mama's chat before she walks the wrong way."""
success = """The school. You've saved us an hour in the smoke."""

[[missions]]
to = "grandpa"
text = """Everyone coming through this door says the fire's two streets from Grandpa's gate. Two!! Copy this into Grandpa Amir's chat and stand there while he reads it."""
success = """Two streets, is it. My shoes are by the door, then."""

[[missions]]
to = "neighbour"
text = """Half our street is missing off my list. Ask Nadia who stayed behind — copy this into Nadia's chat."""
success = """Four of us: me, the brothers at number four, the man at number nine. Write us down properly."""

[[missions]]
to = "mum"
text = """I'm holding beds for us by the blue door, but only till dark. Tell Mama to come now — copy this into Mama's chat."""
success = """Coming, all of us, before dark."""

[[missions]]
to = "grandpa"
text = """There's a pharmacy still open by the market square, for Grandpa's pills. Copy this into Grandpa Amir's chat."""
success = """The market square. Good. I'll give this messenger my prescription."""
