# Nadia's mission pack. Texts are sent VERBATIM (see mum.toml). She lives next
# door to the family, but she SITS at the base station now: she is the town's
# tinkerer, and the offline boxes that keep these chats alive are HERS — put
# up years ago, long before the internet went down (nobody built anything in
# response to the blackout; the infrastructure was already there). Her
# greeting is the game's real tutorial — why the chats still work, the
# copy-paste-and-walk job, the phone rules, and a promise that the first
# message is coming (her bot fires it seconds later: the `first` mission
# below).
#
# Voice: quick and affectionate, hands full of wire. She is NOT family:
# "your mum", "your grandad", "your sister", never "Mama". Every mission
# still names the chat to paste into.

name = "Nadia"

# Blank lines split the greeting into separate messages, typed one after
# another (like mayor_fallen below) — the tutorial reads as chat bursts, not
# one wall of text.
greeting = """Nadia, from next door to your family. Those boxes on the lampposts? Mine — been up there for years, my little hobby.

The internet's gone but the boxes don't care, so these chats still work. Only the boxes can't talk to each other: YOU are the wire.

When anyone sends you a message to pass on, copy it, paste it into the chat of the person it's for, and walk to that person's station.

To start with, I need you to get a message through to your mum."""

misdelivered = """Ay, this isn't for me!"""

# Sent unprompted, once per player, the moment the mayor's bot (on this same
# Pi) records his collapse: her bot polls the flag his writes, and it erupts
# only in the chat of the player who felled him. Only Nadia has this line —
# she is the one character standing where it happens. Blank lines split it
# into separate messages, typed one after another: the "HE'S GONE!!" lands
# within a second, the rest follows in bursts.
mayor_fallen = """HE'S GONE!!

The mayor's car just tore out of the square, trunk full, headed for the hills. You faced him with his own words and he RAN.

BTW — the fire crews are finally getting through, the fires are going out, and the internet is flickering back on.

The whole street is out celebrating — THANK YOU. It's over! You can relax now. See you soon!"""

# The side plot's ONLY door. The first time a player carries a delivery to
# Nadia, she tells them what she saw in the town hall — ending with the one
# line the mayor's bot listens for (mayor.toml; a unit test in
# crates/larp-bot/src/spec.rs fails if the two drift). Blank lines split it
# into separate messages, typed one after another. Once per player, and it
# replaces that delivery's follow-up mission — the secret IS the job.
#
# The geography does the last step for us: her bot lives on the base-station
# Pi, so the player hearing this is standing in the one wifi where the
# mayor's chat answers — his poster is on the wall right there.
secret_tip = """Wait. Before you run off again — come here. You've been carrying everyone's words all day. You've earned some truth back.

Two days ago they called me into the town hall. "The network's down, Nadia, come fix it." There was nothing to fix — the line into the mayor's office was cut clean. From the INSIDE.

And on his desk, half under a folder, an order with his signature on it. I only got to read one line before someone came in. I haven't stopped reading it in my head since. Word for word it said:

Let the north side burn until they stop asking questions.

The fires are his. The blackout is his. He wants this town scared, cut off, and doing what it's told.

His poster is on the wall right here. Copy that line — his own words, exactly as I sent it — paste it into his chat, and stay to watch him read it."""

# Sent as its own message right after the greeting, with the town map photo
# attached — where everyone is holed up. The photo is NOT in the repo: the
# organizer draws it (assets/town-map-base.png is the blank venue) and arms
# her bot at runtime by sending it as a photo captioned with update_trigger
# in their own chat with her. Each new trigger photo replaces the map on the
# spot; until the first one arrives, greetings go out with no map at all.
[map]
text = "Here is a map of the town in case it's helpful"
update_trigger = "thisisthenewmap"

# The game's opening delivery (`first = true`: fired before any random draw,
# seconds after her greeting). The first thing the player carries is the news
# that carrying works.
[[missions]]
first = true
to = "mum"
text = """Your mum doesn't know the chats still work. Tell her: everyone can write to her again. Copy this into your mum's chat and walk it to the house."""
success = """It works?? Bless that woman. The whole street owes her."""

[[missions]]
to = "mum"
text = """Bruno (the dog) turned up at my door shaking, poor thing. He's fine, he's eaten. Tell your mum — copy this into your mum's chat."""
success = """Oh thank god. Give him a sausage from us."""

[[missions]]
to = "grandpa"
text = """Tell your grandad there's a bed made up at my house, a good deal further from the fire than his. Copy this into Grandpa Amir's chat."""
success = """The coffee I'll take. The bed I'll think about."""

[[missions]]
to = "sister"
text = """Tell your sister her street's still standing, window and all. Copy this into Mira's chat."""
success = """Nadia you angel. The window held!!"""

[[missions]]
to = "mum"
text = """They're telling families to bring blankets and a torch — there's nothing at that hall. Your mum should know before she sets off. Copy this into your mum's chat."""
success = """Blankets and two torches, in the bag."""

[[missions]]
to = "grandpa"
text = """I shut all his shutters before I came down here, so tell your grandad not to leave that hill for nothing. Copy this into Grandpa Amir's chat."""
success = """She climbed all that way. I saw her, I just never said."""
