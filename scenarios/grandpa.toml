# Grandpa Amir's mission pack. Texts are sent VERBATIM (see mum.toml).
# He lives alone at the top of the hill and refuses to be evacuated — which
# makes him the one person who can SEE the whole fire.
#
# Voice: an old man who types slowly and says the least he can get away with.

name = "Grandpa Amir"

greeting = """Amir here. Top of the hill. Good to know this thing still reaches somebody down there."""

misdelivered = """Not for me, this one!"""

# No informant_tip: only Mira hands out the informant (see mum.toml).

[[missions]]
to = "neighbour"
text = """The hens are still shut in and my knee won't do the path. Someone has to open the coop. Copy this into Nadia's chat."""
success = """Coop's open, all six accounted for. Furious, but alive."""

[[missions]]
to = "sister"
text = """Tell your sister I'm fine and the house is standing. She's to stay at that desk of hers. Copy this into Mira's chat."""
success = """I actually cried. He'd better keep that phone by the window."""

[[missions]]
to = "mum"
text = """If this goes badly: the photo albums are in the blue trunk under the stairs. Someone besides me should know. Copy this into your mum's chat."""
success = """Nobody's losing the photos and nobody's losing you. Noted."""

[[missions]]
to = "neighbour"
text = """There's smoke coming up behind the orchard, right over Nadia's roof — and she's down at the town hall, she can't see it. Copy this into Nadia's chat and hurry."""
success = """Over my roof?? Thank you. I'm sending the water crew to my own street, imagine that."""

[[missions]]
to = "cousin"
text = """The wind's turning east tonight, I can feel it in my knee. The boys at the fire line should know. Copy this into Rafa's chat."""
success = """East?? That changes everything. We're moving now — bless that knee of his."""
