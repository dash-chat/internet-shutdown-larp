# The mayor (docs/design.md). A spec bot like the informant, not a scenario
# pack — keep this file out of scenarios/, where every *.toml is parsed as a
# mission pack. Texts are sent VERBATIM, in order.
#
# His QR poster hangs at the base station and is the FIRST thing players
# scan. He gives the SITUATION only — fires, networks down, be careful — an
# urgent but empty official notice. He says nothing about how the chats keep
# working or what to do about it: encouraging communications would cut
# against what he secretly wants, and he never mentions Nadia. The actual
# onboarding is hers (scenarios/neighbour.toml): the copy-paste-and-walk job,
# the phone rules and the first delivery. The printed sign at the base
# station says to scan ALL the posters, so nothing depends on his greeting
# handing the player onward. His bot runs on the base-station Pi only, so
# his downfall lands where the game began.
#
# The trigger is not a password: it is the line the informant copied out of
# the mayor's own order (anonymous.toml), pasted back into his chat like every
# other message in this game. It MUST stay word-for-word identical to the line
# the informant hands out — a unit test in crates/larp-bot/src/spec.rs
# enforces it. Matching is forgiving about case, whitespace and surrounding
# prose, so a player who pastes the informant's whole message still lands it.
#
# Voice: a small-town mayor being reassuring, a bit informal. The collapse is
# the same man typing with his hands shaking — short lines, no rhetoric left.
# The game ends entirely in-fiction: his last message is him leaving town.

name = "The Mayor"

greeting = [
  """Hey! This is the mayor. We woke up today with fires all over the town, and on top of it the phones and the internet are down.""",
  """This is an emergency. The services are stretched thin and people are cut off from each other.""",
  """Please be careful out there. Stay out of the smoke, and don't take risks.""",
]

# The endgame. The informant leaks this line out of the mayor's own order; the
# players deliver it to him the way they deliver everything else. Answered once
# per message (the op hash is remembered), so a re-sync never replays it.
[[triggers]]
phrase = "Let the north side burn until they stop asking questions"
reply = [
  """Where did you get that.""",
  """Answer me. That paper has never left my office. Never.""",
  """So it's out, all of it... The fires. The shutdowns I've been planning over the years.""",
  """Shit, I can't stay here, they'll arrest me.""",
  """I'm leaving this town tonight and I'm never coming back. Don't look for me.""",
]
